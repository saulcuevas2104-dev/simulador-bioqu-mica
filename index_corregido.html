<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación Cinética de Michaelis-Menten</title>
  <!-- Chart.js CDN para renderizado gráfico continuo -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text-main);
      text-align: center;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
      background: rgba(15, 23, 42, 0.5);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      color: var(--text-main);
    }

    .control-group span.value-display {
      color: var(--accent-color);
      font-family: monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .readout-card {
      background-color: rgba(51, 65, 85, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }

    .readout-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .readout-card .number {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-top: 4px;
      font-family: monospace;
    }

    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Cinética Enzimática de Michaelis-Menten</h2>
    <p class="subtitle">Simulador de velocidad inicial (V₀) frente a la concentración de sustrato ([S])</p>

    <!-- Controles deslizantes -->
    <div class="controls-grid">
      <div class="control-group">
        <label for="vmax">Velocidad máxima (Vₘₐₓ): <span id="vmax-val" class="value-display">100</span> μmol/min</label>
        <input type="range" id="vmax" min="20" max="200" step="5" value="100">
      </div>

      <div class="control-group">
        <label for="km">Constante Kₘ: <span id="km-val" class="value-display">2.0</span> mM</label>
        <input type="range" id="km" min="0.5" max="10.0" step="0.1" value="2.0">
      </div>

      <div class="control-group">
        <label for="s">Concentración [S]: <span id="s-val" class="value-display">2.0</span> mM</label>
        <input type="range" id="s" min="0.1" max="20.0" step="0.1" value="2.0">
      </div>
    </div>

    <!-- Indicadores cuantitativos -->
    <div class="readouts">
      <div class="readout-card">
        <div class="title">Vₘₐₓ</div>
        <div class="number" id="read-vmax">100.0 μmol/min</div>
      </div>
      <div class="readout-card">
        <div class="title">Vₘₐₓ / 2</div>
        <div class="number" id="read-vmax2">50.0 μmol/min</div>
      </div>
      <div class="readout-card">
        <div class="title">Kₘ</div>
        <div class="number" id="read-km">2.00 mM</div>
      </div>
      <div class="readout-card">
        <div class="title">V₀ actual</div>
        <div class="number" id="read-v0">50.0 μmol/min</div>
      </div>
    </div>

    <!-- Contenedor del gráfico -->
    <div class="chart-container">
      <canvas id="mmChart"></canvas>
    </div>
  </div>

  <script>
    // Elementos del DOM
    const inputVmax = document.getElementById('vmax');
    const inputKm = document.getElementById('km');
    const inputS = document.getElementById('s');

    const txtVmaxVal = document.getElementById('vmax-val');
    const txtKmVal = document.getElementById('km-val');
    const txtSVal = document.getElementById('s-val');

    const readVmax = document.getElementById('read-vmax');
    const readVmax2 = document.getElementById('read-vmax2');
    const readKm = document.getElementById('read-km');
    const readV0 = document.getElementById('read-v0');

    // Inicialización de datos para la gráfica
    function generateCurveData(vmax, km) {
      const data = [];
      for (let s = 0; s <= 20; s += 0.2) {
        const v0 = (vmax * s) / (km + s);
        data.push({ x: parseFloat(s.toFixed(1)), y: parseFloat(v0.toFixed(2)) });
      }
      return data;
    }

    // Configuración inicial del gráfico con Chart.js
    const ctx = document.getElementById('mmChart').getContext('2d');
    let mmChart = new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [
          {
            label: 'Curva de Michaelis-Menten',
            data: [],
            borderColor: '#38bdf8',
            borderWidth: 3,
            fill: false,
            pointRadius: 0,
            tension: 0.1
          },
          {
            label: 'Punto [S] = Km',
            data: [],
            backgroundColor: '#f59e0b',
            borderColor: '#f59e0b',
            pointRadius: 6,
            pointHoverRadius: 8,
            type: 'scatter'
          },
          {
            label: 'Punto evaluado [S]',
            data: [],
            backgroundColor: '#ef4444',
            borderColor: '#ef4444',
            pointRadius: 7,
            pointHoverRadius: 9,
            type: 'scatter'
          },
          {
            label: 'Asíntota Vmax',
            data: [],
            borderColor: 'rgba(148, 163, 184, 0.5)',
            borderWidth: 1.5,
            borderDash: [6, 6],
            fill: false,
            pointRadius: 0
          },
          {
            label: 'Línea Vmax/2',
            data: [],
            borderColor: 'rgba(245, 158, 11, 0.5)',
            borderWidth: 1.5,
            borderDash: [4, 4],
            fill: false,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            type: 'linear',
            position: 'bottom',
            title: {
              display: true,
              text: 'Concentración de sustrato [S] (mM)',
              color: '#94a3b8',
              font: { size: 13, weight: 'bold' }
            },
            grid: { color: '#334155' },
            ticks: { color: '#f8fafc' },
            min: 0,
            max: 20
          },
          y: {
            title: {
              display: true,
              text: 'Velocidad inicial V₀ (μmol/min)',
              color: '#94a3b8',
              font: { size: 13, weight: 'bold' }
            },
            grid: { color: '#334155' },
            ticks: { color: '#f8fafc' },
            min: 0,
            max: 220
          }
        },
        plugins: {
          legend: {
            labels: {
              color: '#f8fafc',
              filter: function(item) {
                // Ocultar líneas guía de la leyenda para mayor claridad
                return !['Asíntota Vmax', 'Línea Vmax/2'].includes(item.text);
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` [S]: ${context.parsed.x} mM, V0: ${context.parsed.y} μmol/min`;
              }
            }
          }
        }
      }
    });

    // Actualización de datos y componentes visuales
    function updateSimulation() {
      const vmax = parseFloat(inputVmax.value);
      const km = parseFloat(inputKm.value);
      const s = parseFloat(inputS.value);

      // Calcular velocidades clave
      const v0_current = (vmax * s) / (km + s);
      const vmax2 = vmax / 2;

      // Actualizar interfaz textual
      txtVmaxVal.textContent = vmax;
      txtKmVal.textContent = km.toFixed(1);
      txtSVal.textContent = s.toFixed(1);

      readVmax.textContent = `${vmax.toFixed(1)} μmol/min`;
      readVmax2.textContent = `${vmax2.toFixed(1)} μmol/min`;
      readKm.textContent = `${km.toFixed(2)} mM`;
      readV0.textContent = `${v0_current.toFixed(1)} μmol/min`;

      // 1. Curva principal
      mmChart.data.datasets[0].data = generateCurveData(vmax, km);

      // 2. Punto [S] = Km
      mmChart.data.datasets[1].data = [{ x: km, y: vmax2 }];

      // 3. Punto evaluado por el usuario [S]
      mmChart.data.datasets[2].data = [{ x: s, y: v0_current }];

      // 4. Línea de referencia Vmax
      mmChart.data.datasets[3].data = [{ x: 0, y: vmax }, { x: 20, y: vmax }];

      // 5. Guía de referencia Vmax/2 hacia Km
      mmChart.data.datasets[4].data = [
        { x: 0, y: vmax2 },
        { x: km, y: vmax2 },
        { x: km, y: 0 }
      ];

      // Ajuste dinámico de escala Y
      mmChart.options.scales.y.max = Math.ceil(vmax * 1.15);

      mmChart.update('none'); // Renderizado optimizado sin animaciones pesadas en cada drag
    }

    // Listeners para interacción continua
    inputVmax.addEventListener('input', updateSimulation);
    inputKm.addEventListener('input', updateSimulation);
    inputS.addEventListener('input', updateSimulation);

    // Carga inicial
    updateSimulation();
  </script>
</body>
</html>
